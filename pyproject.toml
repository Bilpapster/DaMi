[project]
name = "dami"
version = "2.0.0"
description = "DaMi: a small data-mining AI agent built with Strands Agents, MCP and a free Kaggle GPU."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "strands-agents[ollama,otel]~=1.63.0",
    "strands-agents-evals~=1.8.0",
    "mcp[cli]~=2.3.0",
    "numpy~=2.5.4",
    "pandas~=3.1.0",
    "scikit-learn~=1.9.1",
    "matplotlib~=3.11.2",
    "streamlit~=1.66.1",
    "python-dotenv~=1.2.4",
    "pyyaml~=6.0.3",
    "requests~=2.34.2",
    "kaggle~=2.2.5",
]

[project.scripts]
dami = "dami.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dami"]
